
version: 2

models:
  - name: stg_hubspot_companies
    description: >
      Cleaned and standardized HubSpot company records.
      Preserves the original company record grain and raw JSON payload.

    columns:
      - name: company_id
        description: "Unique HubSpot company record identifier."
        data_tests:
          - unique
          - not_null

      - name: hs_object_id
        description: "HubSpot object identifier."
        data_tests:
          - not_null

      - name: company_name
        description: >
          Company name. Blank or missing values are standardized to NULL.
          One missing name was identified during source profiling.

      - name: domain
        description: >
          Lowercase, trimmed company domain. One placeholder-style
          domain was identified during source profiling.

      - name: hubspot_url
        description: "HubSpot URL for the company record."

      - name: is_archived
        description: "Indicates whether the HubSpot company record is archived."
        data_tests:
          - not_null

      - name: created_at
        description: "Timestamp when the company record was created."
        data_tests:
          - not_null

      - name: updated_at
        description: "Timestamp when the company record was last updated."
        data_tests:
          - not_null

      - name: raw
        description: "Original JSON payload retained for traceability."

