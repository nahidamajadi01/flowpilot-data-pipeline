
version: 2

models:
  - name: stg_hubspot_contacts
    description: "Staging model for HubSpot contacts. Preserves all source records and the original JSON payload."

    columns:
      - name: contact_id
        description: "HubSpot contact record identifier."
        data_tests:
          - not_null
          - unique

      - name: is_archived
        description: "Indicates whether the HubSpot contact is archived."

      - name: created_at
        description: "Timestamp when the HubSpot contact was created."

      - name: updated_at
        description: "Timestamp when the HubSpot contact was last updated."

      - name: email
        description: "Contact email address, trimmed and converted to lowercase."
        data_tests:
          - not_null
          - unique

      - name: first_name
        description: "Contact first name, with surrounding whitespace removed."

      - name: last_name
        description: "Contact last name, with surrounding whitespace removed."

      - name: url
        description: "Original HubSpot contact record URL."

      - name: source_payload
        description: "Original HubSpot JSON record preserved as a VARIANT."
