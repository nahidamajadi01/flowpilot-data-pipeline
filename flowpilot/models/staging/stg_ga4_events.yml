
version: 2

models:
  - name: stg_ga4_events
    description: >
      Staging model for GA4 events.
      Standardizes event identifiers, traffic source,
      timestamps and engagement fields, and removes
      duplicate event IDs.

    columns:
      - name: event_id
        description: Unique GA4 event identifier.
        data_tests:
          - not_null
          - unique

      - name: user_id
        description: Identifier of the user associated with the event.

      - name: session_id
        description: Identifier of the session associated with the event.

      - name: campaign_id
        description: Campaign identifier associated with the event.

      - name: event_name
        description: Normalized event name.
        data_tests:
          - not_null

      - name: traffic_source
        description: Normalized traffic source, defaulting to unknown.
        data_tests:
          - not_null

      - name: event_timestamp_utc
        description: Event timestamp converted to UTC.
        data_tests:
          - not_null

      - name: event_date
        description: Calendar date derived from the UTC event timestamp.
        data_tests:
          - not_null

      - name: raw_engagement_time_msec
        description: Original engagement time in milliseconds after numeric conversion.

      - name: engagement_time_msec
        description: Engagement time in milliseconds, with negative values set to zero.
        data_tests:
          - not_null

      - name: has_campaign
        description: Indicates whether a campaign ID is present.
        data_tests:
          - not_null

      - name: is_engaged_event
        description: Indicates whether engagement time is greater than zero.
        data_tests:
          - not_null
